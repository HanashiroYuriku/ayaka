{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr><td align="center">
      <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:8px;padding:32px;">
        <tr><td>
          <h2 style="margin:0 0 16px;">{{.AppName}}</h2>
          <p>Hi {{.Name}},</p>
          {{template "body" .}}
          <p style="margin-top:24px;">If the button does not work, copy this link into your browser:</p>
          <p style="word-break:break-all;font-size:13px;color:#52606d;">{{.Link}}</p>
          <p style="font-size:13px;color:#52606d;">This link expires in {{.ValidFor}}.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>{{end}}

{{define "button"}}<p style="margin:24px 0;"><a href="{{.Link}}" style="background:#3b82f6;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block;">{{.ButtonText}}</a></p>{{end}}
