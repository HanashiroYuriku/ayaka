# Hot reload for local development: `make dev`
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/ayaka ."
  bin = "./tmp/ayaka"
  args_bin = ["serve"]
  include_ext = ["go", "yaml", "sql"]
  exclude_dir = ["tmp", "bin", "logs", "docs", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true # allows graceful shutdown on reload

[log]
  time = false

[misc]
  clean_on_exit = true
